<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>WorkforceIQ – AI Workforce Intelligence Agent</title>
<style>
:root{--bg:#eef1f7;--card:#fff;--ink:#101828;--mut:#667085;--line:#e3e8f0;--acc:#3b4ce0;--acc2:#0ea5a4;--bad:#dc2650;--warn:#e9920c;--ok:#12a36b;--hd:linear-gradient(135deg,#1c2370,#3b4ce0 60%,#0ea5a4);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f22;--card:#131a36;--ink:#e9edfb;--mut:#93a0c6;--line:#243056;--acc:#7b89ff;--acc2:#2dd4bf;--bad:#ff5c80;--warn:#ffb340;--ok:#34d399;--hd:linear-gradient(135deg,#141a55,#2b38b8 60%,#0b7f86);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0f22;--card:#131a36;--ink:#e9edfb;--mut:#93a0c6;--line:#243056;--acc:#7b89ff;--acc2:#2dd4bf;--bad:#ff5c80;--warn:#ffb340;--ok:#34d399;--hd:linear-gradient(135deg,#141a55,#2b38b8 60%,#0b7f86);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1100px;margin:auto;padding:12px}
header{background:var(--hd);color:#fff;border-radius:18px;padding:16px 18px;margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:20px;letter-spacing:-.3px}header p{opacity:.85;font-size:12.5px}
.live{background:rgba(255,255,255,.18);padding:4px 10px;border-radius:99px;font-size:12px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
nav button{border:1px solid var(--line);background:var(--card);color:var(--mut);padding:8px 14px;border-radius:99px;font:inherit;font-weight:600;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{font-size:15px;margin-bottom:2px}.sub{color:var(--mut);font-size:12.5px;margin-bottom:10px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}
.grid .card{margin:0}.kpi b{font-size:28px;display:block;letter-spacing:-1px}.kpi span{color:var(--mut);font-size:12px}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.two .card{margin:0}
.row{margin:9px 0}.row .t{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600}.row .t em{font-style:normal;color:var(--mut);font-weight:500}
.bar{height:7px;border-radius:6px;background:var(--line);position:relative;margin-top:3px}.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .5s}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700}
.t-bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}.t-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}.t-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.cols{display:flex;align-items:flex-end;gap:6px;height:110px}.cols div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.cols i{display:block;background:var(--acc);border-radius:6px 6px 0 0;margin-bottom:3px}
.sc{overflow-x:auto}table{border-collapse:separate;border-spacing:2px;font-size:12px}th{color:var(--mut);font-weight:600;padding:2px 4px}td.n{white-space:nowrap;padding-right:8px;position:sticky;left:0;background:var(--card)}
td.c{width:34px;height:24px;text-align:center;border-radius:6px;font-weight:700;font-size:11px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 11px;border-radius:99px;font:inherit;font-size:12.5px;cursor:pointer}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}.btn.g{background:transparent;color:var(--acc);border:1px solid var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc)}.sl{margin:8px 0;font-size:12.5px;font-weight:600;display:flex;justify-content:space-between}
#log{max-height:56vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 0 10px}
.m{max-width:92%;padding:10px 12px;border-radius:14px;font-size:13.5px}.u{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px}.a{align-self:flex-start;background:color-mix(in srgb,var(--acc) 9%,var(--card));border:1px solid var(--line);border-bottom-left-radius:4px}
.tr{font-size:11.5px;color:var(--mut);border-left:3px solid var(--acc2);padding-left:8px;margin-bottom:6px}.m ul{padding-left:18px;margin:4px 0}
.ask{display:flex;gap:8px;margin-top:8px}.ask input{flex:1;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.plan{border-left:4px solid var(--acc);padding-left:12px;margin:12px 0}.plan h4{font-size:14px}.plan p{font-size:12.5px;color:var(--mut)}
svg text{fill:var(--mut);font-size:9px}.risk{font-size:34px;font-weight:800;letter-spacing:-1px}
</style></head><body>
<header><div><h1>WorkforceIQ</h1><p>AI workforce intelligence agent – skills vs. demand, gaps and action plans</p></div><span class="live">● Agent online · 24 employees · 8 skills · 8-week horizon</span></header>
<nav id="nav"></nav><main id="v"></main>
<script>
const S=['Python','Cloud/DevOps','Data Eng','UI/UX','QA Automation','Cybersecurity','ML/AI','Project Mgmt'],SH=['Py','Cloud','Data','UX','QA','Cyber','ML','PM'],W=8;
const D=[[3,3,3.4,3.6,3.5,3.2,3,3],[1.5,2,3,3.8,4.5,4.5,4.2,4],[3,3,3.2,3.2,3,3,3,3],[1.8,1.8,1.6,1.5,1.5,1.5,1.5,1.5],[2,2.2,2.5,2.6,2.8,2.6,2.4,2.2],[1,1,1.5,2,2.6,2.8,2.6,2.4],[1,1.5,2.5,3,3.6,4,4,3.8],[2,2,2,2,1.8,1.8,1.8,1.8]];
let seed=11;const R=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const NM=['Aarav Mehta','Priya Nair','Rohan Das','Sneha Rao','Kiran Patel','Ananya Iyer','Vikram Singh','Meera Joshi','Arjun Reddy','Divya Menon','Karthik S','Neha Gupta','Rahul Verma','Isha Kapoor','Sanjay Pillai','Pooja Shah','Aditya Nair','Lakshmi R','Manish Jain','Tanvi Desai','Harsh Vora','Rachel Thomas','Faisal Khan','Swati Bose'];
const CNT=[4,2,4,4,3,1,2,4],SEC1={0:6,1:2,2:6,3:1,4:5,5:1,6:0,7:5},SEC2={0:1,1:0,2:1,3:0,4:1,5:6,6:2,7:1};
const E=[];CNT.forEach((c,p)=>{for(let k=0;k<c;k++)E.push({p})});
E.forEach((e,i)=>{e.n=NM[i];e.av=Math.round((.7+R()*.3)*100)/100;e.lv=Array(8).fill(0).map(()=>R()<.3?1:0);e.lv[e.p]=R()>.5?5:4;const s=(i%2?SEC2:SEC1)[e.p];if(e.lv[s]<3)e.lv[s]=3;if(R()<.75){const g=[1,5,6][Math.floor(R()*3)];if(e.lv[g]<2)e.lv[g]=2}});
const z0=()=>S.map(()=>({h:0,t:0}));let AL=E.map(e=>e.p),ADJ=z0(),tab='ov',foc=1,CH='',applied=false;
const sup=(s,w,al=AL,aj=ADJ)=>{let x=0;E.forEach((e,i)=>{if(al[i]==s)x+=e.av;else if(e.lv[s]>=3)x+=.15*e.av});return x+aj[s].h*(w>=3?.8:0)+aj[s].t*(w>=4?.6:0)};
const gp=(s,w,al,aj)=>D[s][w]-sup(s,w,al,aj),f1=x=>(Math.round(x*10)/10).toFixed(1);
const sh=(s,al,aj)=>{let a=0;for(let w=0;w<W;w++)a+=Math.max(0,gp(s,w,al,aj));return a};
const pk=(s,al,aj)=>Math.max(...D[s].map((_,w)=>gp(s,w,al,aj)));
const ag=(s,al,aj)=>D[s].reduce((a,_,w)=>a+gp(s,w,al,aj),0)/W;
const tot=(al,aj)=>S.reduce((a,_,s)=>a+sh(s,al,aj),0),dem=D.flat().reduce((a,b)=>a+b);
const risk=(al,aj)=>Math.min(99,Math.round(tot(al,aj)/dem*400)),cov=(al,aj)=>Math.round(100-tot(al,aj)/dem*100);
const rc=r=>r>60?'bad':r>30?'warn':'ok',rl=r=>r>60?'High':r>30?'Medium':'Low';
function planCalc(){const al=E.map(e=>e.p),aj=z0(),it=[];
S.map((_,s)=>s).sort((a,b)=>sh(b,al,aj)-sh(a,al,aj)).forEach(s=>{if(pk(s,al,aj)<.5)return;const o={s,mv:[],tr:[],h:0};
E.forEach((e,i)=>{if(pk(s,al,aj)>.5&&al[i]!=s&&e.lv[s]>=3&&ag(al[i],al,aj)<-.9){o.mv.push(e.n+' ('+SH[al[i]]+' → '+SH[s]+')');al[i]=s}});
if(pk(s,al,aj)>.3){const tc=E.filter((e,i)=>e.lv[s]==2&&al[i]!=s).sort((a,b)=>b.av-a.av),n=Math.min(3,tc.length,Math.ceil(pk(s,al,aj)/.6));o.tr=tc.slice(0,n).map(e=>e.n);aj[s].t=n}
if(pk(s,al,aj)>.3){o.h=Math.ceil(pk(s,al,aj)/.8);aj[s].h=o.h}it.push(o)});
const cost=it.reduce((a,o)=>a+o.h*24+o.tr.length*.9+o.mv.length*.3,0);return{al,aj,it,cost,r:risk(al,aj),sav:(tot(AL,ADJ)-tot(al,aj))*1.5}}
const base=()=>({al:E.map(e=>e.p),aj:z0()});
function line(s){const x=i=>24+i*42,y=v=>130-v*20;let d=D[s].map((v,i)=>x(i)+','+y(v)),u=D[s].map((_,i)=>x(i)+','+y(sup(s,i)));
return `<svg viewBox="0 0 330 150" width="100%">${[0,2,4,6].map(v=>`<line x1="24" x2="318" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="4" y="${y(v)+3}">${v}</text>`).join('')}<polygon points="${d.join(' ')} ${u.reverse().join(' ')}" fill="var(--bad)" opacity=".16"/><polyline points="${D[s].map((v,i)=>x(i)+','+y(v)).join(' ')}" fill="none" stroke="var(--bad)" stroke-width="2.5"/><polyline points="${D[s].map((_,i)=>x(i)+','+y(sup(s,i))).join(' ')}" fill="none" stroke="var(--ok)" stroke-width="2.5"/>${D[s].map((_,i)=>`<text x="${x(i)-6}" y="146">W${i+1}</text>`).join('')}</svg>`}
const bars=(s,w)=>{const d=D[s][w],u=sup(s,w),bad=u<d-.4;return `<div class="row"><div class="t"><span>${S[s]}</span><em>supply ${f1(u)} / demand ${f1(d)} FTE ${bad?'<span class="tag t-bad">gap '+f1(d-u)+'</span>':u>d+.8?'<span class="tag t-ok">surplus</span>':''}</em></div><div class="bar"><i style="width:${d/6*100}%;background:var(--mut);opacity:.35"></i><i style="width:${u/6*100}%;background:${bad?'var(--bad)':'var(--ok)'};height:4px;top:1.5px"></i></div></div>`};
const V={
ov(){const r=risk(AL,ADJ),cr=S.filter((_,s)=>pk(s,AL,ADJ)>=1).length,wk=[...Array(W)].map((_,w)=>S.reduce((a,_,s)=>a+Math.max(0,gp(s,w)),0)),mx=Math.max(...wk,1);
return `<div class="card"><h3>The paradox in one view</h3><p class="sub">${E.length} people for ${f1(D.map(a=>a[5]).reduce((a,b)=>a+b))} FTE of Week-6 demand looks balanced on paper – yet skills are mismatched, so deadlines slip.${applied?' <span class="tag t-ok">AI plan applied</span>':''}</p></div>
<div class="grid"><div class="card kpi"><b>${E.length}</b><span>Employees on roster</span></div><div class="card kpi"><b>${cov(AL,ADJ)}%</b><span>Skill-demand coverage</span></div><div class="card kpi"><b style="color:var(--${rc(r)})">${r}</b><span>Delivery risk index · ${rl(r)}</span></div><div class="card kpi"><b>${cr}</b><span>Critical skill gaps</span></div></div>
<div class="two"><div class="card"><h3>Supply vs demand · Week 6 peak</h3><p class="sub">Grey = demand, colour = skilled FTE available</p>${S.map((_,s)=>bars(s,5)).join('')}</div>
<div class="card"><h3>Total shortfall by week</h3><p class="sub">FTE of required skill that nobody can cover</p><div class="cols">${wk.map((v,i)=>`<div><i style="height:${v/mx*90}px;background:${v>3?'var(--bad)':v>1?'var(--warn)':'var(--ok)'}"></i>W${i+1}</div>`).join('')}</div><p class="sub" style="margin-top:12px">Gaps open from Week 3 and peak in Weeks 5–6, exactly when Cloud, ML/AI and Security demand ramps up.</p><button class="btn" onclick="go('ag')">Ask the AI agent</button></div></div>`},
mx(){return `<div class="card"><h3>Employee skill matrix</h3><p class="sub">Proficiency 0–5 (≥3 = project-ready). Availability = share of time free for project work.</p><div class="sc"><table><tr><th></th>${SH.map(h=>`<th>${h}</th>`).join('')}<th>Avail</th></tr>${E.map((e,i)=>`<tr><td class="n">${e.n} <span style="color:var(--mut)">${AL[i]!=e.p?'→'+SH[AL[i]]:''}</span></td>${e.lv.map(l=>`<td class="c" style="background:color-mix(in srgb,var(--acc) ${l*19}%,transparent);color:${l>=4?'#fff':'var(--ink)'}">${l||''}</td>`).join('')}<td class="c">${Math.round(e.av*100)}%</td></tr>`).join('')}</table></div></div>`},
gaps(){const aj=ADJ[foc],r=risk(AL,ADJ),b=risk(...Object.values(base()));
return `<div class="chips">${S.map((n,s)=>`<button class="chip ${s==foc?'on':''}" onclick="foc=${s};draw()">${n}</button>`).join('')}</div>
<div class="two"><div class="card"><h3>${S[foc]} · demand vs skilled supply</h3><p class="sub"><span style="color:var(--bad)">■</span> demand <span style="color:var(--ok)">■</span> supply · shaded = gap</p>${line(foc)}<p class="sub">Peak gap ${f1(Math.max(0,pk(foc,AL,ADJ)))} FTE · ${D[foc].filter((_,w)=>gp(foc,w)>.4).length} of 8 weeks at risk</p></div>
<div class="card"><h3>What-if simulator</h3><p class="sub">Hires land in Week 4 (80% productive). Trainees contribute from Week 5 (60%).</p><div class="sl"><span>New hires</span><b id="vh">${aj.h}</b></div><input type="range" min="0" max="6" value="${aj.h}" oninput="vh.textContent=this.value" onchange="ADJ[foc].h=+this.value;draw()"><div class="sl"><span>Employees upskilled</span><b id="vt">${aj.t}</b></div><input type="range" min="0" max="6" value="${aj.t}" oninput="vt.textContent=this.value" onchange="ADJ[foc].t=+this.value;draw()">
<p style="margin-top:12px">Delivery risk: <span class="risk" style="color:var(--${rc(r)})">${r}</span> <span class="sub">was ${b} before any action</span></p><button class="btn g" onclick="ADJ=z0();AL=E.map(e=>e.p);applied=false;draw()">Reset scenario</button></div></div>`},
ag(){return `<div class="card"><h3>Ask the workforce agent</h3><p class="sub">It reads the skill matrix, computes gaps and reasons about hire, train or reallocate.</p><div class="chips">${['Which skills are critical?','Who can be upskilled in Cloud?','Should we hire or train?','Who can be reallocated?','What is the deadline risk?','Run the optimal plan','What will it cost?'].map(q=>`<button class="chip" onclick="ask('${q}')">${q}</button>`).join('')}</div><div id="log">${CH||'<div class="m a">Hi, I am WorkforceIQ. Pick a question above or type your own, for example <i>who knows ML?</i></div>'}</div><div class="ask"><input id="q" placeholder="Ask about skills, gaps, hiring, risk…" onkeydown="if(event.key==='Enter')ask(q.value)"><button class="btn" onclick="ask(q.value)">Send</button></div></div>`},
pl(){const p=planCalc(),b=base(),r0=risk(b.al,b.aj);
return `<div class="card"><h3>AI recommended action plan</h3><p class="sub">Order of preference: reallocate (fastest, cheapest) → upskill (medium) → hire (slowest, most expensive).</p><div class="grid"><div class="kpi"><b style="color:var(--bad)">${r0}</b><span>Risk today</span></div><div class="kpi"><b style="color:var(--${rc(p.r)})">${p.r}</b><span>Risk after plan</span></div><div class="kpi"><b>₹${f1(p.cost)}L</b><span>Plan cost</span></div><div class="kpi"><b>₹${f1(tot(b.al,b.aj)*1.5)}L</b><span>Delay cost at stake</span></div></div>
${p.it.map(o=>`<div class="plan"><h4>${S[o.s]} <span class="tag ${pk(o.s,b.al,b.aj)>=1.5?'t-bad':'t-warn'}">peak gap ${f1(pk(o.s,b.al,b.aj))} FTE</span></h4><p><b>Reallocate:</b> ${o.mv.join(', ')||'no surplus donor available'}<br><b>Upskill:</b> ${o.tr.join(', ')||'none'}<br><b>Hire:</b> ${o.h?o.h+' external hire(s)':'none needed'}</p></div>`).join('')}
<button class="btn" onclick="applyPlan();go('gaps')">Apply plan to simulator</button> <p class="sub" style="margin-top:8px">Assumed costs: hire ₹24L/yr loaded, training ₹0.9L, reallocation ₹0.3L, delay penalty ₹1.5L per FTE-week uncovered.</p></div>`}};
function applyPlan(){const p=planCalc();AL=p.al;ADJ=p.aj;applied=true}
function draw(){document.getElementById('v').innerHTML=V[tab]();document.getElementById('nav').innerHTML=[['ov','Overview'],['mx','Skill matrix'],['gaps','Gap analysis'],['ag','AI agent'],['pl','Action plan']].map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');const l=document.getElementById('log');if(l)l.scrollTop=l.scrollHeight}
function go(t){tab=t;draw();scrollTo(0,0)}
function ans(q){q=q.toLowerCase();const p=planCalc(),b=base(),top=S.map((_,s)=>s).sort((a,c)=>sh(c,AL,ADJ)-sh(a,AL,ADJ)),si=[/python/,/cloud|devops/,/data/,/ui|ux|design/,/qa|test/,/cyber|secur/,/ml|ai\b|machine/,/project|pm\b/].findIndex(r=>r.test(q));
let st=['Reading skill matrix (24 × 8)','Computing weekly supply vs demand'],h='';
if(/apply|run|optimal|plan/.test(q)&&!/cost/.test(q)){applyPlan();st.push('Optimising reallocate → upskill → hire');h=`Plan applied. Delivery risk fell from <b>${risk(b.al,b.aj)}</b> to <b>${risk(AL,ADJ)}</b> at a cost of ₹${f1(p.cost)}L. See the <b>Gap analysis</b> tab for the new curves.`}
else if(/cost|budget|roi/.test(q)){st.push('Pricing hire, training, reallocation');h=`The plan costs <b>₹${f1(p.cost)}L</b> and avoids about <b>₹${f1(p.sav)}L</b> of delay penalty.<ul>${p.it.map(o=>`<li>${S[o.s]}: ${o.h} hire, ${o.tr.length} trained, ${o.mv.length} moved</li>`).join('')}</ul>`}
else if(/risk|deadline|late|miss/.test(q)){const r=risk(AL,ADJ);st.push('Scoring shortfall against demand');h=`Delivery risk is <b>${r}/100 (${rl(r)})</b>. Slippage clusters in Weeks 4–7, driven by ${top.slice(0,3).map(s=>S[s]).join(', ')}.`}
else if(/realloc|surplus|bench|move/.test(q)){st.push('Finding over-supplied skills with transferable talent');const sp=S.map((_,s)=>s).filter(s=>ag(s,b.al,b.aj)<-.9);h=`Surplus skills: <b>${sp.map(s=>S[s]).join(', ')}</b>.<ul>${p.it.flatMap(o=>o.mv).map(m=>`<li>${m}</li>`).join('')||'<li>None</li>'}</ul>`}
else if(/hire|hiring|recruit|train|upskill|learn/.test(q)&&si<0){st.push('Comparing lead times: hire 3 wks, train 4 wks, move 0 wks');h=`Hire only what internal options cannot cover:<ul>${p.it.map(o=>`<li><b>${S[o.s]}</b>: move ${o.mv.length}, train ${o.tr.length}, hire ${o.h}</li>`).join('')}</ul>`}
else if(si>=0){const tr=E.filter(e=>e.lv[si]==2),rd=E.filter(e=>e.lv[si]>=3);st.push('Filtering employees by '+S[si]+' proficiency');h=`<b>${S[si]}</b>: ${rd.length} project-ready (${rd.map(e=>e.n.split(' ')[0]+' L'+e.lv[si]).join(', ')}).<br>${/train|upskill|learn/.test(q)?`Upskill candidates: ${tr.map(e=>e.n).join(', ')||'none'}.`:`Peak gap ${f1(Math.max(0,pk(si,AL,ADJ)))} FTE; ${tr.length} people at level 2 could be trained.`}`}
else{st.push('Ranking gaps by total shortfall');h=`Most critical gaps:<ul>${top.slice(0,4).map(s=>`<li><b>${S[s]}</b> – peak ${f1(pk(s,AL,ADJ))} FTE short, ${D[s].filter((_,w)=>gp(s,w)>.4).length} weeks at risk</li>`).join('')}</ul>Try “who can be reallocated?” next.`}
